name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: accountant-util-stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select release version and check signing identity
        id: plan
        run: node .github/release/prepare.cjs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.tag != ''

      - uses: swatinem/rust-cache@v2
        if: steps.plan.outputs.tag != ''
        with:
          workspaces: "./src-tauri"

      - name: Install frontend dependencies
        if: steps.plan.outputs.tag != ''
        run: npm ci
        env:
          npm_config_node_gyp: ${{ github.workspace }}/node_modules/node-gyp/bin/node-gyp.js

      - name: Check
        if: steps.plan.outputs.tag != ''
        run: npm run verify:ci

      - name: Build signed Windows installer in a draft release
        if: steps.plan.outputs.tag != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.plan.outputs.tag }}
          releaseName: Accountant Util ${{ steps.plan.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Verify uploaded bytes before publishing
        if: steps.plan.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'signed-release'
          gh release download $env:RELEASE_TAG --dir $assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run --quiet --locked --manifest-path .github/release/Cargo.toml -- $assets $env:RELEASE_TAG.Substring(1) $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $draft = gh release view $env:RELEASE_TAG --json isDraft,targetCommitish | ConvertFrom-Json
          if (!$draft.isDraft -or $draft.targetCommitish -ne (git rev-parse HEAD)) { throw 'Unexpected release target' }
          gh release edit $env:RELEASE_TAG --draft=false --latest

      - name: Test public updater endpoint without credentials
        if: steps.plan.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: node .github/release/check-public.cjs
